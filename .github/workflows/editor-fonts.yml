name: Editor fonts
on:
  pull_request:
    paths: ['web/app/vsc-ext/**', 'crates/markview-web/tests/fonts/**', '.github/workflows/editor-fonts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fonts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --prefix web/app/vsc-ext
      - run: npm --prefix web/app/vsc-ext run lint
      - run: npm --prefix web/app/vsc-ext test
