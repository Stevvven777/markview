name: Editor fonts
on:
  pull_request:
    paths: ['editors/**', 'crates/markview-web/tests/fonts/**', '.github/workflows/editor-fonts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fonts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --prefix editors
      - run: npm --prefix editors run lint
      - run: npm --prefix editors test
      - if: runner.os == 'Linux'
        run: npx --prefix editors playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm --prefix editors run test:browser
