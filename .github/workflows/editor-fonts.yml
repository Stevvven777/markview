name: Editor fonts
on:
  pull_request:
    paths: ['web/packages/**', 'crates/**', 'Cargo.lock', 'web/app/vsc-ext/**', 'crates/markview-web/tests/fonts/**', '.github/workflows/editor-fonts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fonts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: .tools
      - run: node web/scripts/wasm.mjs --setup
      - run: node web/scripts/wasm.mjs
      - run: npm ci --prefix web/app/vsc-ext
      - run: npm --prefix web/app/vsc-ext run lint
      - run: npm --prefix web/app/vsc-ext test
      - if: runner.os == 'Linux'
        run: npx --prefix web/app/vsc-ext playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm --prefix web/app/vsc-ext run test:browser
      - if: runner.os == 'macOS'
        run: cargo build --release --locked --bin markview
      - if: runner.os == 'macOS'
        working-directory: web/app/vsc-ext
        env:
          MARKVIEW_BINARY: ${{ github.workspace }}/target/release/markview
        run: node --test tests/native-fonts.mjs tests/native-export.mjs
      - if: runner.os == 'macOS'
        run: npm --prefix web/app/vsc-ext run package
