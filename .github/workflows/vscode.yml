name: VS Code extension
on:
  pull_request:
    paths: ['editors/**', 'web/**', 'src/**', 'crates/**', 'Cargo.*', 'assets/**', 'scripts/**', '.github/workflows/vscode.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extensions:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libvulkan1 mesa-vulkan-drivers xvfb
      - run: cargo fmt --all --check
      - run: cargo clippy --release --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      - run: cargo test --release --locked --test vscode_export
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web run setup
      - run: pnpm --dir web build
      - run: npm ci --prefix editors
      - run: npm --prefix editors run build
      - run: npm --prefix editors run lint
      - run: npm --prefix editors test
      - name: Package extension
        run: npm --prefix editors run package -- ${{ matrix.target }}
      - run: pnpm --dir web exec playwright install --with-deps chromium --only-shell
      - run: npm --prefix editors run test:browser
      - name: Installed extension host
        if: runner.os != 'Linux'
        run: npm --prefix editors run test:host -- --installed
      - name: Linux installed extension host
        if: runner.os == 'Linux'
        run: xvfb-run -a npm --prefix editors run test:host -- --installed
      - name: Export without opening preview
        if: runner.os != 'Linux'
        run: npm --prefix editors run test:host -- --installed --export-only
      - name: Linux export without opening preview
        if: runner.os == 'Linux'
        run: xvfb-run -a npm --prefix editors run test:host -- --installed --export-only
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-${{ matrix.target }}
          path: artifacts/vscode/*.vsix
