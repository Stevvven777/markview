[package]
name = "markview-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
parley.workspace = true
pollster.workspace = true
ratex-font.workspace = true
ratex-katex-fonts.workspace = true
ratex-types.workspace = true
swash.workspace = true
tiny-skia.workspace = true
web-time.workspace = true
# No windowing toolkit: the host hands over a `SurfaceSource`, so drawing and
# driving text never names a window.
# No font directories: a front end that compiles this for the Web has no
# filesystem to read.
markview-core = { path = "../markview-core" }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["dx12"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { workspace = true, features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

# The browser backend. A front end that draws into a canvas builds this crate
# for `wasm32-unknown-unknown`, where none of the native backends above apply
# and the GL backend is the one a canvas can present through.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgl"] }

[lints]
workspace = true
